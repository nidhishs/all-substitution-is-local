[project]
name = "residual-expertise-not-decision-value"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "pillow>=10.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pytest>=8.0",
]
inference = [
    "torch>=2.0",
    "torchvision>=0.15",
    "torchxrayvision>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]
markers    = [
    "acceptance: validates paper claims against pre-computed results (requires results/)",
]
